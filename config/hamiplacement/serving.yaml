apiVersion: v1
kind: Service
metadata:
  name: koord-hami-placement
  namespace: koordinator-system
spec:
  selector:
    koord-app: koord-descheduler
  ports:
    - name: https
      port: 443
      targetPort: 9443
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: koord-hami-placement
  annotations:
    cert-manager.io/inject-ca-from: koordinator-system/koord-hami-placement-serving
webhooks:
  - name: placement.hami.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    namespaceSelector:
      matchLabels:
        hami.io/managed-placement: "true"
    matchConditions:
      - name: replicaset-owned
        expression: >-
          has(object.metadata.ownerReferences) &&
          object.metadata.ownerReferences.exists(ref,
            has(ref.controller) && ref.controller && ref.apiVersion == 'apps/v1' && ref.kind == 'ReplicaSet')
    clientConfig:
      service:
        namespace: koordinator-system
        name: koord-hami-placement
        path: /mutate-hami-placement
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
